{% if page_obj.has_other_pages %}<nav class="inline-actions spaced" aria-label="Order pages">{% if page_obj.has_previous %}<a class="btn secondary small" href="?page={{ page_obj.previous_page_number }}&amp;status={{ status|urlencode }}&amp;source={{ source|urlencode }}">Previous</a>{% endif %}<span class="small muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="btn secondary small" href="?page={{ page_obj.next_page_number }}&amp;status={{ status|urlencode }}&amp;source={{ source|urlencode }}">Next <svg aria-hidden="true"><use href="#i-arrow"/></svg></a>{% endif %}</nav>{% endif %}
