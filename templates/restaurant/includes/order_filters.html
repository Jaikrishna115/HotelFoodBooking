<form method="get" class="panel" style="padding:15px 20px;margin-bottom:23px"><div class="compact-form"><label class="small muted" for="filter-status">Show</label><select id="filter-status" name="status" aria-label="Order status"><option value="">All statuses</option><option value="placed" {% if status == 'placed' %}selected{% endif %}>Placed</option><option value="accepted" {% if status == 'accepted' %}selected{% endif %}>Accepted</option><option value="preparing" {% if status == 'preparing' %}selected{% endif %}>Preparing</option><option value="ready" {% if status == 'ready' %}selected{% endif %}>Ready</option><option value="completed" {% if status == 'completed' %}selected{% endif %}>Completed</option><option value="cancelled" {% if status == 'cancelled' %}selected{% endif %}>Cancelled</option></select>{% if is_worker or is_billing %}<select name="source" aria-label="Order source"><option value="">All sources</option><option value="online" {% if source == 'online' %}selected{% endif %}>Customer orders</option><option value="staff" {% if source == 'staff' %}selected{% endif %}>Table orders</option></select>{% endif %}<button class="btn secondary small">Apply filters</button><a class="text-link" href="{{ request.path }}">Reset</a></div></form>
